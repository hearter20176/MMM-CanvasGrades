name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # node --run needs Node 22 or newer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node --run lint
      - run: node --run lint:css
      - run: node --run lint:md
      - run: node --run format:check
      - run: node --run test

  node20:
    # the module itself supports Node 20 (the MagicMirror baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test --test-timeout=30000 test/*.test.js
