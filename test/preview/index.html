<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>MMM-CanvasGrades preview</title>
		<!-- Font Awesome comes from the host MagicMirror install (valid when this module sits in MagicMirror/modules/). -->
		<link rel="stylesheet" href="../../../../css/font-awesome.css" />
		<link rel="stylesheet" href="../../MMM-CanvasGrades.css" />
		<style>
			/* MagicMirror main.css sets html { font-size: 20px }; em and rem sizes in the module CSS depend on it. */
			html {
				font-size: 20px;
			}
			html,
			body {
				margin: 0;
				background: #000;
				color: #fff;
				font-family: "Roboto Condensed", Arial, sans-serif;
			}
			#frame {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				width: 1080px;
				box-sizing: border-box;
				padding: 60px; /* MagicMirror stock page margins */
				background: #000;
			}
			.region .module {
				width: 465px;
			}
			.region .module.cg-wide {
				width: 960px;
			}
			.region.hidden {
				display: none;
			}
		</style>
	</head>
	<body class="mm-night">
		<!-- top_left and top_right columns of a 1080 px portrait screen -->
		<div id="frame">
			<div class="region top left" id="region_left">
				<div class="container">
					<div class="module MMM-CanvasGrades" id="module_left_MMM-CanvasGrades">
						<div class="module-content"></div>
					</div>
				</div>
			</div>
			<div class="region top right" id="region_right">
				<div class="container">
					<div class="module MMM-CanvasGrades" id="module_right_MMM-CanvasGrades">
						<div class="module-content"></div>
					</div>
				</div>
			</div>
		</div>
		<script src="./preview.js"></script>
		<script src="../../MMM-CanvasGrades.js"></script>
		<script>
			window.CGPreview.run();
		</script>
	</body>
</html>
